version: '3.8'

services:
  filmbot:
    image: ghcr.io/slowcvinorul/filmbot:main   # ← вот здесь main вместо latest
    container_name: film_bot_container
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
    restart: unless-stopped

volumes:
  sqlite_data:
